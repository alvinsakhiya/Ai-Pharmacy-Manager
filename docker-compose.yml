# One-command stack: PostgreSQL + Redis + Django API + React (nginx).
# Redis is provisioned for the documented future background-jobs roadmap.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharmacy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://pharma:pharma@db:5432/pharmacy
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
