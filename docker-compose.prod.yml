# Production Docker Compose TEMPLATE for a synthetic-data Oracle/free-VM demo.
# See docs/ORACLE_FREE_VM_DEPLOYMENT.md. Review and COMPLETE before use:
#   * Secrets come ONLY from .env (no defaults here). Never commit .env.
#   * The backend runs a production WSGI server (gunicorn). Add gunicorn to the
#     backend dependencies (a later hardening step) before running this file.
#   * Build the frontend static assets (`npm run build`) so Caddy can serve them.
# PostgreSQL and the backend are internal-only: no host ports are published.
#
# Run with:  docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No `ports:` — PostgreSQL is reachable only on the internal Docker network.

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Fail-safe: production settings enforce DEBUG=False, secure cookies, HSTS,
      # and refuse to start without the required secrets.
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # Production WSGI server. Requires `gunicorn` in the backend dependencies.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No `ports:` — the backend is reached only via the Caddy reverse proxy.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro      # built frontend static assets (npm run build)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
