[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pharmacy-manager-backend"
version = "0.1.0"
description = "Backend foundation for the AI Pharmacy Manager academic prototype"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.7,<5.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1,<26.0",
    "mypy>=1.15,<2.0",
    "pre-commit>=4.2,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.11,<0.12",
]

[tool.setuptools.packages.find]
include = ["config*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
