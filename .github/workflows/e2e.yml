name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pharmacy
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: pharmacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy -d pharmacy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: e2e-secret-key-at-least-32-bytes-long
      DATABASE_URL: postgresql://pharmacy:pharmacy@localhost:5432/pharmacy
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      CSRF_TRUSTED_ORIGINS: http://localhost:4173
      LOGIN_THROTTLE_RATE: 1000/min
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Prepare backend database
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_demo
      - name: Start backend
        working-directory: backend
        run: python manage.py runserver 0.0.0.0:8000 &
      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/health/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: VITE_API_BASE_URL=http://localhost:8000 npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: E2E_BASE_URL=http://localhost:4173 npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
